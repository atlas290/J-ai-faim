<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff8e8">
  <meta name="description" content="Votre profil J'ai faim — favoris, compte et accès restaurateur.">
  <title>Mon Profil — J'ai faim</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="page-header">
    <h1 class="page-title">Mon Profil</h1>
  </header>

  <main>

<!-- ============ CARTE INVITÉ ============ -->
    <section class="profile-guest" aria-label="Bienvenue">
      <div class="profile-guest-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      
      <h2 class="profile-guest-title" id="profile-nom">Bienvenue sur J'ai faim</h2>
      <p class="profile-guest-text" id="profile-email"></p>
      
      <a href="login-client.html" class="cta-primary" id="btn-login" style="text-decoration:none;">
        Se connecter
      </a>

      <button type="button" class="btn-outline-accent" id="btn-logout" hidden>
        Se déconnecter
      </button>
    </section>

    <!-- ============ MES FAVORIS ============ -->
    <section class="section profile-favorites" aria-labelledby="favorites-title">
      <h2 id="favorites-title" class="section-title">Mes Favoris</h2>

      <div class="empty-state">
        <div class="empty-state-icon empty-state-icon--heart" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </div>
        <h3 class="empty-state-title">Vous n'avez pas encore de favoris.</h3>
        <p class="empty-state-text">Touchez le cœur sur un restaurant pour le retrouver ici.</p>
      </div>
    </section>

    <!-- ============ ESPACE RESTAURATEUR ============ -->
    <section class="profile-resto" aria-labelledby="resto-title">
      <h2 id="resto-title" class="profile-resto-title">Espace Restaurateur</h2>
      <a href="login-resto.html" class="btn-outline-accent">Accéder à mon espace resto</a>
    </section>

  </main>

  <!-- ============ BOTTOM NAV ============ -->
  <nav class="bottom-nav" aria-label="Navigation principale">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 11l9-8 9 8v10a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2V11z"/>
      </svg>
      <span>Accueil</span>
    </a>

    <a href="recherche.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <span>Recherche</span>
    </a>

    <a href="hasard.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3z"/>
      </svg>
      <span>Surprends-moi</span>
    </a>

    <a href="profil.html" class="nav-item active" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Profil</span>
    </a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <!-- LA LIGNE MANQUANTE EST ICI -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="js/profil.js"></script>

</body>
</html>
