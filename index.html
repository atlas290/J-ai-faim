<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/style.css">

<body>

  <!-- ÉCRAN DE DÉMARRAGE -->
  <div id="splash-screen">
    <div class="splash-text">J'ai faim<span>.</span></div>
  </div>

  <!-- ============ HEADER ============ -->
  <header class="app-header">
    <div class="header-top">
      <a href="index.html" class="logo" aria-label="J'ai faim — Accueil">
        J'ai faim<span class="logo-dot">.</span>
      </a>
      <button class="icon-btn" type="button" aria-label="Mon profil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
    </div>

    <button class="location-pill" type="button" aria-label="Changer la zone de livraison">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span>Livrer à <strong>Cotonou</strong></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>
  </header>

  <main>

    <!-- ============ BARRE DE RECHERCHE ============ -->
    <form class="search-bar" role="search" onsubmit="return false;">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-input" placeholder="Que voulez-vous manger ?" autocomplete="off">
      <button type="button" class="filter-btn" aria-label="Filtrer les résultats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="6" x2="20" y2="6"/>
          <line x1="7" y1="12" x2="17" y2="12"/>
          <line x1="10" y1="18" x2="14" y2="18"/>
        </svg>
      </button>
    </form>

    <!-- ============ CATÉGORIES (Nouveau) ============ -->
    <section class="categories" id="categories" aria-label="Catégories de repas">
      <button class="category active" type="button" data-category="Petit déjeuner">
        <span class="category-emoji" aria-hidden="true">☕</span>
        <span class="category-label">Petit déjeuner</span>
      </button>
      <button class="category" type="button" data-category="Déjeuner">
        <span class="category-emoji" aria-hidden="true">🍛</span>
        <span class="category-label">Déjeuner</span>
      </button>
      <button class="category" type="button" data-category="Dîner">
        <span class="category-emoji" aria-hidden="true">🌙</span>
        <span class="category-label">Dîner</span>
      </button>
    </section>

    <!-- ============ BANNIÈRE PROMO ============ -->
    <section class="promo" aria-label="Offre du jour">
      <a href="https://wa.me/22997000000?text=Bonjour%2C%20je%20veux%20le%20poulet%20brais%C3%A9%20%C3%A0%20-20%25" target="_blank" rel="noopener noreferrer" class="promo-card">
        <img src="https://images.unsplash.com/photo-1598103442097-8b74394b95c6?w=800&h=400&fit=crop&q=80&auto=format" alt="Poulet braisé grillé, offre du jour" class="promo-bg" width="800" height="400" loading="lazy">
        <div class="promo-content">
          <span class="promo-badge">🔥 Offre du jour</span>
          <h2 class="promo-title">Poulet braisé<br>à −20%</h2>
          <span class="btn-primary">Commander</span>
        </div>
      </a>
    </section>

    <!-- ============ POPULAIRES ============ -->
    <section class="section" aria-label="Restaurants populaires">
      <header class="section-header">
        <h2 class="section-title">Populaires près de chez vous</h2>
        <a href="recherche.html" class="section-link">Tout voir</a>
      </header>
      <div class="restaurants" id="restaurants-grid"></div>
    </section>

  </main>

  <!-- ============ FOOTER LÉGAL ============ -->
  <footer style="text-align:center; padding: 24px 16px 80px; font-size: 12px; color: var(--text-muted);">
    <a href="mentions-legales.html" style="color:inherit; text-decoration:none; margin: 0 4px;">Mentions légales</a>
    ·
    <a href="confidentialite.html" style="color:inherit; text-decoration:none; margin: 0 4px;">Confidentialité</a>
    ·
    <a href="cgu.html" style="color:inherit; text-decoration:none; margin: 0 4px;">CGU</a>
  </footer>

  <!-- ============ BOTTOM NAV ============ -->
  <nav class="bottom-nav" aria-label="Navigation principale">
    <a href="index.html" class="nav-item active" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v10a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2V11z"/></svg>
      <span>Accueil</span>
    </a>
    <a href="recherche.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Recherche</span>
    </a>
    <a href="hasard.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3z"/></svg>
      <span>Surprends-moi</span>
    </a>
    <a href="profil.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profil</span>
    </a>
  </nav>

  <!-- SDK Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore-compat.js"></script>

  <!-- Ton script d'application -->
  <script src="js/app.js"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('Service Worker OK', reg))
          .catch(err => console.error('Erreur SW', err));
      });
    }
  </script>
